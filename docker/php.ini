; PHP postavke aplikacije (kopira se u conf.d runtime stage-a; dev image nasljeđuje).
;
; Bazni `php:8.3-fpm-alpine` ne aktivira nijedan php.ini, pa su vrijedile ugrađene
; vrijednosti: upload_max_filesize=2M, post_max_size=8M. Zbog toga je prilog
; dokumenta veći od 2 MB tiho odbijan na PHP nivou — Livewire upload nikad ne bi
; završio, a dugme "Sačuvaj" je ostajalo zaglavljeno (Faza 5b, QA prije Faze 7).
;
; Lanac limita ide od najmanjeg ka najvećem, da korisnik uvijek dobije poruku iz
; aplikacije umjesto tihe greške niže u stacku:
;   Filament FileUpload maxSize 10 MB  <  Livewire temp upload 12 MB
;   <  PHP upload_max_filesize 20 MB / post_max_size 24 MB  <  Nginx 32 MB

upload_max_filesize = 20M
post_max_size = 24M
memory_limit = 256M
max_execution_time = 120
